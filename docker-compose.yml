version: '3.8'

services:
  db:
    image: mariadb:10.6
    container_name: mjlo_db
    restart: always
    environment:
      MYSQL_DATABASE: transitomunicipal
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: mjlo_backend
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      - CI_ENVIRONMENT=development
      - database.default.hostname=db
      - database.default.database=transitomunicipal
      - database.default.username=root
      - database.default.password=root
      - database.default.DBDriver=MySQLi
      - database.default.port=3306

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: mjlo_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=/api
      - VITE_BACKEND_URL=http://backend
      - VITE_TINYMCE_API_KEY=unmcqzdx4e88wfy3gqtlbelk1w21unqt3sl8hlcltd49u0o8

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: mjlo_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

volumes:
  db_data:

