
services:
  db:
    image: mariadb:10.6
    container_name: mjlo_db
    restart: always
    env_file: .env
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: mjlo_backend
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      # vendor y caché fuera del montaje de Windows (9p): leerlos desde D:\ en
      # cada petición costaba ~1 s. Si cambia composer.lock: docker compose down
      # y borrar el volumen backend_vendor para que se regenere desde la imagen.
      - backend_vendor:/var/www/html/vendor
      - backend_cache:/var/www/html/writable/cache
      - backend_session:/var/www/html/writable/session
      - ./.env:/var/www/html/.env
    env_file: .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: mjlo_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

    env_file: .env

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: mjlo_phpmyadmin
    restart: always
    ports:
      - "127.0.0.1:8081:80"
    env_file: .env
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

volumes:
  db_data:
  backend_vendor:
  backend_cache:
  backend_session:

