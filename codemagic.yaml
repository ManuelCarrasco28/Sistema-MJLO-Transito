workflows:
  ios-simulator:
    name: Flutter iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Instalar dependencias
        script: |
          cd mobile
          flutter pub get

      - name: Compilar para simulador iOS
        script: |
          cd mobile
          flutter build ios --simulator --debug

      - name: Comprimir aplicación
        script: |
          cd mobile/build/ios/iphonesimulator
          zip -r "$CM_BUILD_DIR/Runner-simulator.zip" Runner.app

    artifacts:
      - Runner-simulator.zip